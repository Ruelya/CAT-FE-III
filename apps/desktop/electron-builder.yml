appId: app.translunar.cat
productName: Translunar CAT
copyright: Copyright © Translunar contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/.package-engine-resource/**"
# scripts/package-desktop.mjs stages a verified host Engine under
# apps/desktop/.package-engine-resource and exports TRANSLUNAR_ENGINE_RESOURCE_DIR
# as that *relative* name. Absolute temp paths break on Windows because
# electron-builder joins `from` against the project directory.
# Direct electron-builder invocation without the env intentionally fails so
# target/release is never copied wholesale (stale opposite-platform risk).
extraResources:
  - from: ${env.TRANSLUNAR_ENGINE_RESOURCE_DIR}
    to: engine
  - from: resources/examples/
    to: examples
  - from: resources/plugins/
    to: plugins
# Ship only locales the product UI supports (en-US / zh-CN). Full Chromium
# locale packs add ~45 MB and are unused by Translunar CAT.
electronLanguages:
  - en-US
  - zh-CN
asar: true
compression: maximum
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  artifactName: Translunar-CAT-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  # Default yml lists both arches for documentation; package-desktop.mjs /
  # CI pass --x64 or --arm64 so only the host arch is actually built.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # electron-updater on macOS requires a ZIP update artifact.
    - target: zip
      arch:
        - x64
        - arm64
    - target: dir
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  artifactName: Translunar-CAT-${version}-mac-${arch}.${ext}
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  gatekeeperAssess: false
# Signing/notarization are optional CI secrets; unsigned artifacts remain valid
# for development and internal distribution.
# When CSC_LINK / Apple notarization secrets are present, electron-builder
# invokes the platform signing hooks automatically.
