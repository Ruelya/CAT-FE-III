# Minimal packaging: unsigned artifacts that honor the packaged-main engine
# contract (process.resourcesPath/engine/tl-engine). Windows ships an NSIS
# installer; Linux stays an unpackaged directory. No code signing, no
# notarization, no auto-update, no store releases.
appId: app.translunar.cat
productName: Translunar CAT
copyright: Copyright © Translunar contributors
directories:
  output: release
# The renderer bundle inlines every production dependency (vite), and
# esbuild.electron.mjs bundles main/preload into self-contained files that
# inline @translunar/contracts and every other workspace runtime dependency,
# leaving only electron + node builtins external. That keeps node_modules out
# of the asar; scripts/desktop-check-package.mjs fails the build if a bare
# @translunar/* import ever reappears inside the archive.
files:
  - dist/**/*
  - package.json
  - "!node_modules"
# scripts/desktop-stage-engine.mjs copies the release tl-engine binary into
# .package-engine/ before electron-builder runs. The `from` path must stay
# relative: electron-builder joins it against the project directory, and
# absolute temp paths silently drop the binary on Windows.
extraResources:
  - from: .package-engine/
    to: engine
# Ship only locales the product UI supports. Full Chromium locale packs add
# ~45 MB and are unused by Translunar CAT.
electronLanguages:
  - en-US
  - zh-CN
asar: true
linux:
  executableName: translunar-cat
  target:
    - dir
  artifactName: translunar-cat-${version}-linux-${arch}.${ext}
# The win section runs natively on the windows-latest lane of
# .github/workflows/package.yml; scripts/desktop-package-win-semantics.test.mjs
# pins the nsis target and the relative extraResources mapping. The user
# deliverable is the NSIS installer exe; win-unpacked/ remains a build
# intermediate that package:check inspects. The mac section is config-only:
# this repository has no macOS lane, so it keeps the plain `dir` target.
win:
  target:
    - nsis
  artifactName: translunar-cat-setup-${version}-${arch}.${ext}
# Assisted (multi-page) installer so the user can pick the install directory.
# electron-builder's NSIS is unicode by default and auto-selects the installer
# language from the OS, zh-CN included. Unsigned, per-user, no license page.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - dir
  category: public.app-category.productivity
  artifactName: translunar-cat-${version}-mac-${arch}.${ext}
