# -----------------------------------------------------------------------------
# Subagents：开关 + 按类型指定模型
# -----------------------------------------------------------------------------
# 模型优先级：
#   1. [subagents.models].<type>
#   2. agent frontmatter `model`
#   3. 父会话模型
#
# 思维等级：config 的 [subagents.models] 只路由 model，不设 effort。
# effort 写在 .grok/agents/*.md frontmatter（`effort:`），与下方约定一致。
#
# Autoloop agents（.grok/agents/）：
#   trellis-plan / trellis-research / trellis-implement /
#   trellis-review / trellis-verify / trellis-fix / trellis-closeout
# 内置（默认勿用于 Trellis autoloop）：general-purpose / explore / plan

[subagents]
enabled = true

[subagents.toggle]
general-purpose = true
explore = true
plan = true

# key = spawn 时的 subagent_type（与 agent frontmatter name 一致）
[subagents.models]
# —— 高阶（moe-hub gpt-5.6-sol）——
trellis-plan    = "gpt-5.6-sol"
trellis-review  = "gpt-5.6-sol"
# 内置 plan 若被误 spawn，与 trellis-plan 同模型
plan            = "gpt-5.6-sol"

# —— 其余 worker / 常用内置：官方 grok-4.5 ——
trellis-research  = "grok-4.5"
trellis-implement = "grok-4.5"
trellis-verify    = "grok-4.5"
trellis-fix       = "grok-4.5"
trellis-closeout  = "grok-4.5"
general-purpose   = "grok-4.5"
explore           = "grok-4.5"

# -----------------------------------------------------------------------------
# 会话 / 功能
# -----------------------------------------------------------------------------

[features]
codebase_indexing = true
remote_fetch = true

# =============================================================================
# Agent frontmatter 约定（写在 .grok/agents/*.md，与 [subagents.models] 对齐）
# =============================================================================
# trellis-plan:    model: gpt-5.6-sol   effort: max
# trellis-review:  model: gpt-5.6-sol   effort: xhigh
# 其余 trellis-*:  model: grok-4.5      effort: high
#
# 合并进 ~/.grok/config.toml 后：新开 `grok --agent orchestrator` 会话生效。
# =============================================================================
)
