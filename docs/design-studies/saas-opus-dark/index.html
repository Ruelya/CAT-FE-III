/* ===== base.css — structure shared by every visual system ===== */
/* Structural layer shared by every visual system.
   Owns layout, density arithmetic and state logic; every colour, face and
   dimension reads from a variable a theme is expected to set. Themes must
   not need to restate a selector to change the look. */

/* ------------------------------------------------------ variable contract */

:root {
  /* Surfaces, from furthest back to closest to the reader. */
  --bg: #eef0f4;
  --surface: #f7f8fa;
  --surface-2: #ffffff;
  --surface-3: #ffffff;
  --sunken: #e2e5eb;
  --chrome: #f7f8fa;
  --chrome-text: #1b202b;

  /* Lines. `--hair` is the 1px rule used between rows and panels. */
  --border: #cdd2da;
  --border-soft: #e2e5eb;
  --border-strong: #aab1bd;
  --hair: 1px solid var(--border-soft);
  --hair-strong: 1px solid var(--border);

  /* Text. */
  --text: #1b202b;
  --text-muted: #555d6d;
  --text-faint: #7d8595;

  /* One accent per system. */
  --accent: #1743ae;
  --accent-strong: #113487;
  --accent-soft: #dbe3f7;
  --accent-faint: #edf1fb;
  --on-accent: #ffffff;

  /* Semantics. Never used decoratively. */
  --ok: #1e6f4c;
  --ok-soft: #ddefe6;
  --warn: #8a5a00;
  --warn-soft: #f4ead3;
  --danger: #a4302a;
  --danger-soft: #f6e2e0;
  --info: #355070;
  --info-soft: #e6ebf2;

  /* Faces. */
  --font-ui: system-ui, sans-serif;
  --font-num: ui-monospace, monospace;
  --font-mono: ui-monospace, monospace;

  /* Scale. */
  --fs-xs: 10.5px;
  --fs-sm: 11.5px;
  --fs-md: 13px;
  --fs-lg: 15px;
  --fs-xl: 19px;
  --lh: 1.5;
  --lh-tight: 1.32;

  /* Label treatment — the loudest single lever between the systems. */
  --label-transform: none;
  --label-tracking: 0;
  --label-weight: 600;
  --label-size: var(--fs-xs);
  --label-color: var(--text-faint);
  --strong-weight: 600;
  --heading-tracking: 0;

  /* Rhythm. Every gap is a multiple of --u so density is one number. */
  --u: 4px;
  --s1: calc(var(--u) * 0.5);
  --s2: var(--u);
  --s3: calc(var(--u) * 2);
  --s4: calc(var(--u) * 3);
  --s5: calc(var(--u) * 4);
  --s6: calc(var(--u) * 6);

  /* Fixed heights. */
  --proto-h: 34px;
  --titlebar-h: 30px;
  --ribbon-h: 54px;
  --status-h: 24px;
  --tab-h: 30px;
  --row-h: 32px;
  --ctl-h: 26px;
  --ctl-h-sm: 21px;
  --rail-left: 252px;
  --rail-right: 336px;
  --brand-w: 128px;
  --menu-item-w: 52px;
  --cell-pad-y: 7px;
  --cell-pad-x: 10px;

  /* Geometry. */
  --r-sm: 2px;
  --r-md: 4px;
  --r-lg: 6px;
  --r-pill: 999px;

  /* Depth. Light systems keep this near zero; overlays always lift. */
  --shadow-1: 0 1px 2px rgba(20, 24, 33, 0.06);
  --shadow-2: 0 2px 8px rgba(20, 24, 33, 0.1);
  --shadow-3: 0 16px 44px rgba(20, 24, 33, 0.24);
  --focus: 0 0 0 2px var(--accent-soft), 0 0 0 3px var(--accent);
  --scrim: rgba(20, 24, 33, 0.34);

  /* Row state expression. */
  --row-hover: rgba(20, 24, 33, 0.035);
  --row-active: var(--accent-faint);
  --row-marker: var(--accent);
  --row-marker-w: 2px;

  --dur: 120ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);

  /* Proofreading chip contract. Each segment state gets a fill and an
     optional outline; a study retints by restating these. Defaults route
     through the semantic tokens, so a theme that only sets --ok-soft and
     friends already gets a coherent proofreading view. */
  --pv-done: var(--ok-soft);
  --pv-done-line: transparent;
  --pv-todo: var(--warn-soft);
  --pv-todo-line: transparent;
  --pv-lock: var(--info-soft);
  --pv-lock-line: transparent;
  --pv-none: var(--sunken);
  --pv-none-line: var(--border);
  --pv-radius: var(--r-md);
}

/* -------------------------------------------------------------- resets */

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: var(--lh);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  margin: 0;
}
button {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-align: left;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}
h1,
h2,
h3,
p,
dl,
dd,
dt,
figure {
  margin: 0;
}
code {
  font-family: var(--font-mono);
  font-size: 0.92em;
}
svg.ic {
  flex: none;
  display: block;
}
mark {
  background: var(--warn-soft);
  color: var(--text);
  border-radius: 1px;
  padding: 0 1px;
}
:focus-visible {
  outline: none;
  box-shadow: var(--focus);
  border-radius: var(--r-sm);
  position: relative;
  z-index: 3;
}
::selection {
  background: var(--accent-soft);
  color: var(--text);
}

/* Numerals are tabular everywhere so columns of figures align. */
.num,
kbd,
.kbdi {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* Reusable micro-label. The three systems differ most visibly here. */
.railsec__head h2,
.rgroup__label,
.panel__head h3,
.subhead,
.gridbar__label,
.grid thead th,
.details dt,
.field > span,
.preview__title,
.dsec h3 {
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  letter-spacing: var(--label-tracking);
  text-transform: var(--label-transform);
  color: var(--label-color);
}

/* ------------------------------------------------------- prototype bar */

.proto {
  height: var(--proto-h);
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 0 var(--s4);
  background: #10141b;
  color: #b9c0cc;
  font-size: var(--fs-sm);
  border-bottom: 1px solid #000;
}
.proto__brand {
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
  color: #7f8899;
}
.proto__brand b {
  color: #f2f4f8;
  font-weight: 600;
}
.proto__label {
  color: #656e7e;
  margin-left: var(--s3);
}
.proto__scenes {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
}
.scene {
  padding: 3px var(--s3);
  border-radius: var(--r-sm);
  color: #b9c0cc;
  font-size: var(--fs-sm);
  white-space: nowrap;
}
.scene:hover {
  background: #1e242e;
  color: #fff;
}
.scene--on {
  background: #e9edf4;
  color: #10141b;
  font-weight: 600;
}

/* ------------------------------------------------------------- shell */

#root {
  height: 100%;
  display: flex;
  flex-direction: column;
}
.app {
  position: relative;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-rows: var(--titlebar-h) auto minmax(0, 1fr) var(--status-h);
  background: var(--bg);
  overflow: hidden;
}
.app[data-noproject] {
  grid-template-rows: var(--titlebar-h) minmax(0, 1fr) var(--status-h);
}

.titlebar {
  display: flex;
  align-items: stretch;
  height: var(--titlebar-h);
  background: var(--chrome);
  color: var(--chrome-text);
  border-bottom: var(--hair-strong);
  position: relative;
  z-index: 40;
}
.titlebar__brand {
  width: var(--brand-w);
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding-left: var(--s4);
  font-weight: 650;
  font-size: var(--fs-sm);
  letter-spacing: 0.01em;
}
.mark {
  width: 12px;
  height: 12px;
  flex: none;
  border-radius: var(--r-sm);
  background: var(--accent);
  box-shadow: inset 0 0 0 3px var(--surface-2);
}
.menubar {
  display: flex;
  align-items: stretch;
}
.menubar__item {
  width: var(--menu-item-w);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-sm);
  color: var(--text-muted);
}
.menubar__item:hover {
  background: var(--row-hover);
  color: var(--text);
}
.menubar__item[data-open] {
  background: var(--accent);
  color: var(--on-accent);
}
.titlebar__title {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-sm);
  color: var(--text-faint);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  padding: 0 var(--s4);
}
.wincontrols {
  display: flex;
  flex: none;
}
.wincontrol {
  width: 42px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
}
.wincontrol:hover {
  background: var(--row-hover);
  color: var(--text);
}
.wincontrol--close:hover {
  background: #c0392b;
  color: #fff;
}

.menudrop {
  position: absolute;
  top: var(--titlebar-h);
  left: calc(var(--brand-w) + var(--menu-index) * var(--menu-item-w));
  z-index: 60;
  min-width: 246px;
  padding: var(--s2);
  background: var(--surface-3);
  border: var(--hair-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
}
.menudrop__item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  height: var(--ctl-h);
  padding: 0 var(--s3);
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
}
.menudrop__item:hover:not(:disabled) {
  background: var(--accent);
  color: var(--on-accent);
}
.menudrop__item:hover:not(:disabled) .menudrop__key {
  color: inherit;
  opacity: 0.75;
}
.menudrop__check {
  width: 12px;
  flex: none;
  color: var(--accent);
  font-size: var(--fs-sm);
}
.menudrop__item:hover:not(:disabled) .menudrop__check {
  color: inherit;
}
.menudrop__label {
  flex: 1;
  white-space: nowrap;
}
.menudrop__key {
  font-family: var(--font-num);
  font-size: var(--fs-xs);
  color: var(--text-faint);
}
.menudrop__sep {
  height: 1px;
  margin: var(--s2) var(--s3);
  background: var(--border-soft);
}

/* ------------------------------------------------------------ ribbon */

.ribbon {
  height: var(--ribbon-h);
  display: flex;
  align-items: stretch;
  gap: var(--s4);
  padding: 0 var(--s4);
  background: var(--surface);
  border-bottom: var(--hair-strong);
  overflow: hidden;
}
.ribbon__groups {
  display: flex;
  align-items: stretch;
  min-width: 0;
  overflow: hidden;
}
.rgroup {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--s2) var(--s4);
  border-right: var(--hair);
}
.rgroup:first-child {
  padding-left: 0;
}
.rgroup__items {
  display: flex;
  align-items: center;
  gap: var(--s1);
  flex: 1;
}
.rgroup__label {
  text-align: center;
  padding-top: 2px;
  line-height: 1;
}
.rbtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 46px;
  padding: var(--s2) var(--s3);
  border-radius: var(--r-md);
  font-size: var(--fs-xs);
  color: var(--text-muted);
  white-space: nowrap;
  transition: background var(--dur) var(--ease);
}
.rbtn:hover:not(:disabled) {
  background: var(--row-hover);
  color: var(--text);
}
.rbtn:active:not(:disabled) {
  background: var(--sunken);
}
.rbtn--primary {
  color: var(--accent);
}
.rbtn--primary:hover:not(:disabled) {
  background: var(--accent-faint);
  color: var(--accent-strong);
}
.ribbon__tail {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--s3);
  flex: none;
}
.rbtn--quiet {
  flex-direction: row;
  gap: var(--s2);
  height: var(--ctl-h);
  padding: 0 var(--s3);
  font-size: var(--fs-sm);
  border: var(--hair-strong);
}
.searchbox {
  display: flex;
  align-items: center;
  gap: var(--s2);
  height: var(--ctl-h);
  width: 188px;
  padding: 0 var(--s3);
  background: var(--surface-2);
  border: var(--hair-strong);
  border-radius: var(--r-md);
  color: var(--text-faint);
}
.searchbox:focus-within {
  box-shadow: var(--focus);
  border-color: var(--accent);
}
.searchbox input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font-size: var(--fs-sm);
  color: var(--text);
}
.searchbox input::-webkit-search-cancel-button {
  appearance: none;
}

.kbd {
  display: inline-flex;
  gap: 2px;
}
kbd,
.kbdi {
  display: inline-block;
  padding: 0 4px;
  min-width: 16px;
  text-align: center;
  font-size: var(--fs-xs);
  line-height: 15px;
  color: var(--text-faint);
  background: var(--sunken);
  border-radius: var(--r-sm);
}
.kbdi {
  margin-left: var(--s2);
}

/* -------------------------------------------------------------- body */

.body {
  display: flex;
  min-height: 0;
  min-width: 0;
  background: var(--bg);
}
.rail {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: none;
  background: var(--surface);
  overflow-y: auto;
  overflow-x: hidden;
}
.rail--left {
  width: var(--rail-left);
  border-right: var(--hair-strong);
}
.rail--right {
  width: var(--rail-right);
  border-left: var(--hair-strong);
  overflow: hidden;
}
.rail[data-collapsed] {
  display: none;
}
.splitter {
  width: 5px;
  flex: none;
  margin: 0 -3px;
  z-index: 5;
  cursor: col-resize;
  background: transparent;
  transition: background var(--dur) var(--ease);
}
.splitter:hover {
  background: var(--accent-soft);
}
.center {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface-2);
}

/* --------------------------------------------------------- left rail */

.railsec {
  padding: var(--s4);
  border-bottom: var(--hair);
  flex: none;
}
.railsec--files {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.railsec__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  margin-bottom: var(--s3);
  min-height: 18px;
}
.iconbtn {
  display: grid;
  place-items: center;
  width: var(--ctl-h-sm);
  height: var(--ctl-h-sm);
  flex: none;
  border-radius: var(--r-sm);
  color: var(--text-faint);
}
.iconbtn:hover:not(:disabled) {
  background: var(--row-hover);
  color: var(--text);
}
.proj__name {
  font-size: var(--fs-md);
  font-weight: var(--strong-weight);
  line-height: var(--lh-tight);
}
.proj__pair {
  font-size: var(--fs-sm);
  color: var(--text-faint);
  margin-top: 2px;
}
.proj__progress {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin-top: var(--s3);
}
.proj__progress .num {
  font-size: var(--fs-sm);
  color: var(--text-muted);
}
.meter {
  flex: 1;
  display: flex;
  height: 5px;
  min-width: 40px;
  background: var(--sunken);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.meter__confirmed {
  background: var(--ok);
}
.meter__draft {
  background: var(--warn);
  opacity: 0.55;
}

.railsearch {
  display: flex;
  align-items: center;
  gap: var(--s2);
  height: var(--ctl-h-sm);
  padding: 0 var(--s3);
  margin-bottom: var(--s3);
  background: var(--surface-2);
  border: var(--hair-strong);
  border-radius: var(--r-md);
  color: var(--text-faint);
}
.railsearch:focus-within {
  box-shadow: var(--focus);
  border-color: var(--accent);
}
.railsearch input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font-size: var(--fs-sm);
}
.railsearch input::-webkit-search-cancel-button {
  appearance: none;
}

.empty {
  padding: var(--s4) 0;
  font-size: var(--fs-sm);
  color: var(--text-faint);
}
.empty--big {
  padding: var(--s6);
  text-align: center;
}

/* ---------------------------------------------------------- file tree */

.tree {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  min-height: 0;
  margin: 0 calc(var(--s4) * -1);
  --tree-indent: 13px;
  --tree-row-h: 24px;
}
.tree__filerow {
  position: relative;
  display: flex;
  align-items: stretch;
}
.tree__row {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--s1);
  height: var(--tree-row-h);
  padding: 0 var(--s3) 0 var(--s2);
  font-size: var(--fs-sm);
  color: var(--text-muted);
  white-space: nowrap;
}
.tree__row:hover {
  background: var(--row-hover);
  color: var(--text);
}
/* Indent guides, one hairline per ancestor level. */
.tree__indent {
  display: flex;
  flex: none;
  align-self: stretch;
}
.tree__indent i {
  width: var(--tree-indent);
  border-left: 1px solid var(--tree-guide, var(--border-soft));
}
.tree__chev {
  display: grid;
  place-items: center;
  width: 14px;
  flex: none;
  color: var(--text-faint);
  transition: transform var(--dur) var(--ease);
}
.tree__chev[data-open="1"] {
  transform: rotate(90deg);
}
.tree__icon {
  display: grid;
  place-items: center;
  flex: none;
  color: var(--tree-icon, var(--text-faint));
  margin-right: 2px;
}
.tree__row--dir .tree__icon {
  color: var(--tree-icon-dir, var(--text-faint));
}
.tree__name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree__row--dir .tree__name {
  font-weight: var(--strong-weight);
  color: var(--text);
}
.tree__tail {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex: none;
  padding-left: var(--s2);
}
.tree__count {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  opacity: 0.7;
}
.tree__qa {
  min-width: 15px;
  padding: 0 3px;
  text-align: center;
  font-family: var(--font-num);
  font-size: var(--fs-xs);
  line-height: 14px;
  border-radius: var(--r-pill);
  background: var(--danger-soft);
  color: var(--danger);
}
/* Progress rides under the number itself as a fill line, so the badge costs
   one column instead of two and the file name keeps the width. */
.tree__prog {
  position: relative;
  width: 24px;
  flex: none;
  text-align: right;
  font-size: var(--fs-xs);
  color: var(--text-faint);
  line-height: 14px;
}
.tree__prog::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: linear-gradient(
    to right,
    var(--ok) 0 var(--pct),
    var(--border-soft) var(--pct) 100%
  );
}
.tree__prog[data-done="1"] {
  color: var(--ok);
}
.tree__prog[data-none="1"] {
  opacity: 0.5;
}
.tree__prog[data-none="1"]::after {
  opacity: 0.5;
}

/* An open tab is marked; the file being edited is marked harder. */
.tree__filerow[data-opentab] .tree__name {
  color: var(--text);
}
.tree__filerow[data-active] .tree__row {
  background: var(--row-active);
  color: var(--text);
  font-weight: var(--strong-weight);
  box-shadow: inset var(--row-marker-w) 0 0 var(--row-marker);
}
.tree__filerow[data-active] .tree__icon {
  color: var(--accent);
}
.tree__remove {
  position: absolute;
  right: var(--s2);
  top: 50%;
  transform: translateY(-50%);
  opacity: 0;
}
.tree__filerow:hover .tree__remove,
.tree__remove:focus-visible {
  opacity: 1;
}
.tree__remove:hover {
  color: var(--danger);
}
.tree__confirm {
  position: absolute;
  right: var(--s2);
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: var(--s2);
  background: var(--surface);
  padding-left: var(--s2);
}

.details {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.details > div {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
}
.details dd {
  font-size: var(--fs-sm);
  text-align: right;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ------------------------------------------------------- doc tabs */

.doctabs {
  display: flex;
  align-items: stretch;
  height: var(--tab-h);
  flex: none;
  background: var(--surface);
  border-bottom: var(--hair-strong);
  overflow-x: auto;
}
.doctab {
  display: flex;
  align-items: center;
  gap: var(--s1);
  padding: 0 var(--s2) 0 var(--s4);
  border-right: var(--hair);
  color: var(--text-muted);
  font-size: var(--fs-sm);
  white-space: nowrap;
  position: relative;
}
.doctab:hover {
  background: var(--row-hover);
}
.doctab[data-active] {
  background: var(--surface-2);
  color: var(--text);
  font-weight: var(--strong-weight);
}
.doctab[data-active]::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 2px;
  background: var(--accent);
}
.doctab > [role="tab"] {
  padding: 0;
  font-size: inherit;
  color: inherit;
}
.doctab__x {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: var(--r-sm);
  color: var(--text-faint);
  opacity: 0;
}
.doctab:hover .doctab__x,
.doctab[data-active] .doctab__x,
.doctab__x:focus-visible {
  opacity: 1;
}
.doctab__x:hover {
  background: var(--sunken);
  color: var(--text);
}
.doctab__add {
  display: grid;
  place-items: center;
  width: 30px;
  flex: none;
  color: var(--text-faint);
}
.doctab__add:hover {
  background: var(--row-hover);
  color: var(--text);
}

/* -------------------------------------------------------- banners */

.banner {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  flex: none;
  font-size: var(--fs-sm);
  border-bottom: 1px solid;
}
.banner[data-tone="danger"] {
  background: var(--danger-soft);
  border-color: var(--danger);
  color: var(--danger);
}
.banner[data-tone="warn"] {
  background: var(--warn-soft);
  border-color: var(--warn);
  color: var(--warn);
}
.banner__icon {
  flex: none;
  font-size: var(--fs-md);
}
.banner__text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.banner__text b {
  font-weight: var(--strong-weight);
}
.banner__sub {
  font-size: var(--fs-xs);
  opacity: 0.86;
  overflow: hidden;
  text-overflow: ellipsis;
}
.banner__sub code {
  font-family: var(--font-mono);
}
.banner__acts {
  display: flex;
  gap: var(--s2);
  flex: none;
}
.banner--inline {
  border: 1px solid;
  border-radius: var(--r-md);
  margin: var(--s3) 0;
  align-items: flex-start;
}

/* --------------------------------------------------------- gridbar */

.gridbar {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s2) var(--s4);
  flex: none;
  background: var(--surface-2);
  border-bottom: var(--hair);
  min-height: 32px;
}
.gridbar__label {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex: none;
}
.gridbar__spacer {
  flex: 1;
}
.gridbar__count {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  flex: none;
}
.chips {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: var(--ctl-h-sm);
  padding: 0 var(--s3);
  border: var(--hair-strong);
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  color: var(--text-muted);
  white-space: nowrap;
  transition: all var(--dur) var(--ease);
}
.chip:hover {
  border-color: var(--border-strong);
  color: var(--text);
}
.chip--on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: var(--strong-weight);
}
.chip__x {
  display: grid;
  place-items: center;
  opacity: 0.8;
  margin-right: -2px;
}
.chip--text {
  font-family: var(--font-mono);
  max-width: 200px;
  overflow: hidden;
}

/* ------------------------------------------------------------ grid */

.gridwrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
}
.grid {
  flex: 1;
  min-width: 0;
  overflow: auto;
  background: var(--surface-2);
}
.grid table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
}
.grid thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  text-align: left;
  padding: var(--s2) var(--cell-pad-x);
  background: var(--surface);
  border-bottom: var(--hair-strong);
  font-weight: var(--label-weight);
}
.grid thead .loc {
  margin-left: var(--s2);
  font-family: var(--font-num);
  text-transform: none;
  letter-spacing: 0;
  opacity: 0.7;
}
.c-n {
  width: 54px;
}
.c-st {
  width: 236px;
}
.grid tbody tr {
  border-bottom: var(--hair);
}
.grid tbody tr:hover {
  background: var(--row-hover);
}
.grid td {
  padding: var(--cell-pad-y) var(--cell-pad-x);
  vertical-align: top;
  min-height: var(--row-h);
}
.grid td.c-n {
  position: relative;
  text-align: right;
  padding-right: var(--s4);
  color: var(--text-faint);
  font-size: var(--fs-sm);
  user-select: none;
}
.grid td.c-src {
  color: var(--text-muted);
}
.grid td.c-tgt {
  color: var(--text);
}
.rowbar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--row-marker-w);
  background: transparent;
}

/* Row state. Selection is a marker plus a wash; never a colour swap that
   would collide with the state column's own semantics. */
.grid tbody tr[data-active] {
  background: var(--row-active);
}
.grid tbody tr[data-active] .rowbar {
  background: var(--row-marker);
}
.grid tbody tr[data-active] td.c-n {
  color: var(--accent);
  font-weight: var(--strong-weight);
}
.grid tbody tr[data-locked] td.c-src,
.grid tbody tr[data-locked] td.c-tgt {
  color: var(--text-faint);
}
/* An open finding ticks the target cell it belongs to, so the warning sits
   on the text it is about rather than on the row as a whole. */
.grid tbody tr[data-qa] td.c-tgt {
  box-shadow: inset 2px 0 0 var(--warn);
}

.tok {
  font-family: var(--font-mono);
  font-size: 0.9em;
  padding: 0 3px;
  border-radius: var(--r-sm);
  background: var(--info-soft);
  color: var(--info);
  white-space: nowrap;
}
.tok[data-danger] {
  background: var(--danger-soft);
  color: var(--danger);
  box-shadow: inset 0 0 0 1px var(--danger);
}
.tgt--empty {
  color: var(--text-faint);
}

.editor {
  margin: calc(var(--cell-pad-y) * -1 + 1px) -4px;
}
.editor textarea {
  display: block;
  width: 100%;
  min-height: calc(var(--row-h) - 6px);
  padding: calc(var(--cell-pad-y) - 1px) 4px;
  resize: none;
  overflow: hidden;
  border: 0;
  border-radius: var(--r-sm);
  background: var(--surface-3);
  outline: 2px solid var(--accent);
  outline-offset: -1px;
  line-height: var(--lh);
  font-family: inherit;
  font-size: inherit;
}

/* State, provenance and lock read as three fixed columns so the eye can
   scan one of them down the page without the others shifting under it. */
.statecell {
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.lockglyph {
  order: 3;
  display: grid;
  place-items: center;
  color: var(--text-faint);
  flex: none;
}
.statechip {
  order: 1;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  min-width: 62px;
  gap: 3px;
  height: 18px;
  padding: 0 var(--s2);
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  white-space: nowrap;
  flex: none;
}
.statechip__g {
  font-size: 11px;
  line-height: 1;
}
.statechip[data-state="confirmed"] {
  background: var(--ok-soft);
  color: var(--ok);
}
.statechip[data-state="draft"] {
  background: var(--warn-soft);
  color: var(--warn);
}
.statechip[data-state="untranslated"] {
  background: var(--sunken);
  color: var(--text-faint);
}
.statechip__qa {
  font-family: var(--font-num);
  padding-left: 3px;
  margin-left: 1px;
  border-left: 1px solid currentColor;
  opacity: 0.85;
}

.origin {
  order: 2;
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  min-width: 52px;
  gap: 2px;
  padding: 0 var(--s2);
  height: 18px;
  line-height: 18px;
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  border: 1px solid;
  flex: none;
}
.origin[data-grade="exact"] {
  color: var(--ok);
  border-color: var(--ok);
  background: var(--ok-soft);
}
.origin[data-grade="fuzzy"] {
  color: var(--warn);
  border-color: var(--warn);
  background: var(--warn-soft);
}
.origin[data-grade="ai"] {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-faint);
}
/* An edited match is no longer evidence of its origin — mute it. */
.origin[data-muted] {
  color: var(--text-faint);
  border-color: var(--border);
  background: transparent;
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.origin__k {
  font-weight: var(--strong-weight);
  letter-spacing: 0.02em;
}

.rowmenu-wrap {
  order: 4;
  margin-left: auto;
  position: relative;
  flex: none;
}
.rowmenu__btn {
  opacity: 0;
}
tr:hover .rowmenu__btn,
tr[data-active] .rowmenu__btn,
.rowmenu__btn:focus-visible {
  opacity: 1;
}
.rowmenu {
  position: absolute;
  right: 0;
  top: calc(100% + 2px);
  z-index: 30;
  min-width: 176px;
  padding: var(--s2);
  background: var(--surface-3);
  border: var(--hair-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
}
.rowmenu button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  width: 100%;
  height: var(--ctl-h);
  padding: 0 var(--s3);
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  font-weight: 400;
}
.rowmenu button:hover:not(:disabled) {
  background: var(--accent);
  color: var(--on-accent);
}
.rowmenu__k {
  font-family: var(--font-num);
  font-size: var(--fs-xs);
  color: var(--text-faint);
}
.rowmenu button:hover:not(:disabled) .rowmenu__k {
  color: inherit;
  opacity: 0.75;
}
.rowmenu__sep {
  height: 1px;
  margin: var(--s2) var(--s3);
  background: var(--border-soft);
}

/* ------------------------------------------------------ find widget */

.findwidget {
  position: absolute;
  top: var(--s3);
  right: var(--s5);
  z-index: 20;
  display: flex;
  align-items: flex-start;
  gap: var(--s1);
  padding: var(--s2);
  background: var(--surface-3);
  border: var(--hair-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
}
.findwidget__toggle {
  display: grid;
  place-items: center;
  width: 20px;
  height: var(--ctl-h);
  color: var(--text-faint);
  border-radius: var(--r-sm);
}
.findwidget__toggle:hover {
  background: var(--row-hover);
}
.findwidget__rows {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.findwidget__row {
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.findwidget__input {
  width: 200px;
  height: var(--ctl-h);
  padding: 0 var(--s3);
  background: var(--surface-2);
  border: var(--hair-strong);
  border-radius: var(--r-sm);
  outline: none;
  font-size: var(--fs-sm);
}
.findwidget__input:focus {
  box-shadow: var(--focus);
  border-color: var(--accent);
}
.findwidget__count {
  min-width: 60px;
  font-size: var(--fs-xs);
  color: var(--text-faint);
  text-align: right;
}
.check {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--fs-xs);
  color: var(--text-muted);
  white-space: nowrap;
  cursor: pointer;
}
.check input {
  accent-color: var(--accent);
  margin: 0;
}
.check--row {
  align-items: flex-start;
  font-size: var(--fs-sm);
  gap: var(--s3);
}
.check--row > span {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* --------------------------------------------------------- preview */

.preview {
  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-top: var(--hair-strong);
  max-height: 31%;
}
.preview[data-open] {
  flex: 0 0 auto;
  min-height: 0;
}
.preview__bar {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 0 var(--s3) 0 var(--s4);
  height: 28px;
  flex: none;
}
.preview__spacer {
  flex: 1;
}
.tabs {
  display: flex;
  gap: var(--s1);
}
.tabs [role="tab"] {
  height: 20px;
  padding: 0 var(--s3);
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  color: var(--text-faint);
}
.tabs [role="tab"]:hover {
  background: var(--row-hover);
  color: var(--text);
}
.tabs [role="tab"][data-active] {
  background: var(--accent-faint);
  color: var(--accent);
  font-weight: var(--strong-weight);
}
.legend {
  display: flex;
  gap: var(--s3);
  font-size: var(--fs-xs);
  color: var(--text-faint);
}
.lg {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
/* The legend swatch is a miniature of the chip it stands for, fill and
   border both, so the key and the text below it are the same object. */
.lg::before {
  content: "";
  width: 13px;
  height: 10px;
  border-radius: var(--pv-radius, var(--r-md));
  border: 1px solid transparent;
  background: var(--pv-none);
  border-color: var(--pv-none-line);
}
.lg[data-state="confirmed"]::before {
  background: var(--pv-done);
  border-color: var(--pv-done-line);
}
.lg[data-state="draft"]::before {
  background: var(--pv-todo);
  border-color: var(--pv-todo-line);
}
.lg[data-state="locked"]::before {
  background: var(--pv-lock);
  border-color: var(--pv-lock-line);
}
.preview__body {
  overflow-y: auto;
  padding: 0 var(--s5) var(--s4);
  min-height: 0;
}
.preview__summary {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  padding-bottom: var(--s3);
}
/* Proofreading reads as blocks of colour, not as decorated running text.
   Each segment is its own filled chip and a paragraph is a wrapping row of
   them, so the shape of the document survives while every boundary and
   every state is legible at a glance. Themes retint by overriding the --pv-*
   contract below; nothing here underlines or strikes through. */
.preview__doc {
  max-width: 78ch;
}
.preview__block {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 4px 5px;
  margin-bottom: var(--s4);
}
.pvseg {
  display: block;
  max-width: 100%;
  padding: 4px 9px;
  border: 1px solid transparent;
  border-radius: var(--pv-radius);
  font-size: var(--fs-md);
  line-height: 1.55;
  color: var(--text);
  white-space: normal;
  background: var(--pv-none);
  border-color: var(--pv-none-line);
  transition:
    background var(--dur) var(--ease),
    border-color var(--dur) var(--ease),
    transform var(--dur) var(--ease);
}
.pvseg[data-state="confirmed"] {
  background: var(--pv-done);
  border-color: var(--pv-done-line);
}
.pvseg[data-state="draft"] {
  background: var(--pv-todo);
  border-color: var(--pv-todo-line);
}
.pvseg[data-state="locked"] {
  background: var(--pv-lock);
  border-color: var(--pv-lock-line);
}
/* No target yet, so the chip carries the source yet still reads as a gap. */
.pvseg[data-fallback] {
  color: var(--text-faint);
  background: var(--pv-none);
  border-color: var(--pv-none-line);
  border-style: dashed;
}
.pvseg:hover {
  border-color: var(--accent);
}
.pvseg[data-active] {
  background: var(--surface);
  border-color: var(--accent);
  border-style: solid;
  box-shadow: 0 0 0 1px var(--accent);
  color: var(--text);
  font-weight: var(--strong-weight);
}
.preview__page {
  max-width: 62ch;
  padding: var(--s5) var(--s6);
  background: var(--surface-2);
  border: var(--hair-strong);
  box-shadow: var(--shadow-1);
}
.preview__page h3 {
  font-size: var(--fs-xl);
  font-weight: 650;
  text-transform: none;
  letter-spacing: var(--heading-tracking);
  color: var(--text);
  margin-bottom: var(--s3);
}
.preview__page p {
  margin-bottom: var(--s3);
  line-height: 1.75;
}

/* ------------------------------------------------------- right rail */

.docktabs {
  display: flex;
  align-items: stretch;
  height: var(--tab-h);
  flex: none;
  background: var(--surface);
  border-bottom: var(--hair-strong);
}
.docktabs [role="tab"] {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  font-size: var(--fs-sm);
  color: var(--text-faint);
  border-bottom: 2px solid transparent;
  position: relative;
}
.docktabs [role="tab"]:hover {
  background: var(--row-hover);
  color: var(--text);
}
.docktabs [role="tab"][data-active] {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: var(--strong-weight);
  background: var(--surface-2);
}
.dchip {
  padding: 0 4px;
  border-radius: var(--r-sm);
  font-family: var(--font-num);
  font-size: var(--fs-xs);
  line-height: 15px;
  background: var(--sunken);
  color: var(--text-muted);
}
.dchip[data-tone="ok"] {
  background: var(--ok-soft);
  color: var(--ok);
}
.dchip[data-tone="danger"] {
  background: var(--danger-soft);
  color: var(--danger);
}
.dchip[data-tone="warn"] {
  background: var(--warn-soft);
  color: var(--warn);
}
.dockbody {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
}

.panel {
  border-bottom: var(--hair-strong);
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel--fill {
  flex: 1;
}
.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface);
  border-bottom: var(--hair);
}
.panel__head h3 {
  display: flex;
  align-items: baseline;
  gap: var(--s3);
}
.hcount {
  text-transform: none;
  letter-spacing: 0;
  font-weight: 400;
  color: var(--text-faint);
}
.panel__act {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex: none;
}
.panel__body {
  padding: var(--s3) var(--s4) var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  min-height: 0;
}

.card {
  padding: var(--s3);
  border: var(--hair-strong);
  border-radius: var(--r-md);
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.card--match[data-best] {
  border-color: var(--ok);
  background: var(--surface-2);
  box-shadow: inset var(--row-marker-w) 0 0 var(--ok);
}
.card--cand {
  border-color: var(--accent);
  box-shadow: inset var(--row-marker-w) 0 0 var(--accent);
}
.card__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
}
.card__row--sub {
  padding-left: var(--s3);
  border-left: 2px solid var(--border-soft);
}
.card__lead {
  display: flex;
  align-items: center;
  gap: var(--s2);
  min-width: 0;
}
.card__acts {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex: none;
}
.card__text {
  font-size: var(--fs-md);
  line-height: var(--lh-tight);
}
.card__text--term {
  font-weight: var(--strong-weight);
  font-family: var(--font-mono);
}
.card__sub {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  line-height: var(--lh-tight);
}
.score {
  font-family: var(--font-num);
  font-size: var(--fs-sm);
  font-weight: var(--strong-weight);
  padding: 0 var(--s2);
  border-radius: var(--r-sm);
}
.score[data-grade="exact"] {
  background: var(--ok-soft);
  color: var(--ok);
}
.score[data-grade="fuzzy"] {
  background: var(--warn-soft);
  color: var(--warn);
}
.gradelabel {
  font-size: var(--fs-xs);
  color: var(--text-muted);
}
.memname {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.termtgt {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--fs-md);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 17px;
  padding: 0 var(--s2);
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  background: var(--sunken);
  color: var(--text-muted);
  white-space: nowrap;
  flex: none;
}
.pill[data-tone="ok"] {
  background: var(--ok-soft);
  color: var(--ok);
}
.pill[data-tone="warn"] {
  background: var(--warn-soft);
  color: var(--warn);
}
.pill[data-tone="danger"] {
  background: var(--danger-soft);
  color: var(--danger);
}
.pill--quiet {
  background: transparent;
  border: var(--hair-strong);
  color: var(--text-faint);
}

.subhead {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding-top: var(--s3);
  border-top: var(--hair);
}
.note {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  line-height: var(--lh-tight);
}
.note--warn {
  color: var(--warn);
}
.row {
  display: flex;
  align-items: flex-end;
  gap: var(--s3);
  flex-wrap: wrap;
}
.row--line {
  align-items: center;
  padding: var(--s3) 0;
  border-bottom: var(--hair);
  flex-wrap: nowrap;
}
.row-end {
  display: flex;
  justify-content: flex-end;
  gap: var(--s2);
}
.grow {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rowacts {
  display: flex;
  gap: var(--s1);
  flex: none;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.field--grow {
  flex: 1;
}
.field > span {
  display: flex;
  align-items: center;
}
.field input,
.field select,
.field textarea {
  height: var(--ctl-h);
  padding: 0 var(--s3);
  background: var(--surface-2);
  border: var(--hair-strong);
  border-radius: var(--r-sm);
  outline: none;
  font-size: var(--fs-sm);
  width: 100%;
}
.field textarea {
  height: auto;
  padding: var(--s2) var(--s3);
  resize: vertical;
  line-height: var(--lh);
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  box-shadow: var(--focus);
  border-color: var(--accent);
}
.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s3);
}
.formgrid--1 {
  grid-template-columns: 1fr;
}

/* ------------------------------------------------------------- QA */

.issuegroup {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.issuegroup__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  font-size: var(--fs-xs);
  color: var(--text-faint);
}
.rule {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.issue {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: var(--s3);
  border: var(--hair-strong);
  border-radius: var(--r-md);
  background: var(--surface-2);
}
.issue[data-severity="error"][data-status="open"] {
  border-left: 3px solid var(--danger);
}
.issue[data-severity="warning"][data-status="open"] {
  border-left: 3px solid var(--warn);
}
.issue[data-severity="info"][data-status="open"] {
  border-left: 3px solid var(--info);
}
.issue[data-status="waived"],
.issue[data-status="resolved"] {
  opacity: 0.72;
  background: var(--surface);
}
.issue__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  flex-wrap: wrap;
}
.issue__lead {
  display: flex;
  align-items: center;
  gap: var(--s2);
  min-width: 0;
}
.sev {
  font-size: var(--fs-sm);
  line-height: 1;
}
.issue__acts {
  display: flex;
  gap: var(--s2);
  flex-wrap: wrap;
  padding-top: var(--s1);
}
.issue__acts:empty {
  display: none;
}
.issue__msg {
  font-size: var(--fs-sm);
  line-height: var(--lh-tight);
}
.issue__ev {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-muted);
  background: var(--sunken);
  padding: var(--s2);
  border-radius: var(--r-sm);
  word-break: break-all;
}
.issue__note {
  font-size: var(--fs-xs);
  color: var(--text-faint);
}
.fix {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  padding: var(--s2) var(--s3);
  background: var(--ok-soft);
  border-radius: var(--r-sm);
}
.fix__text {
  font-size: var(--fs-xs);
  color: var(--ok);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ------------------------------------------------------------- AI */

.diff {
  font-size: var(--fs-xs);
  line-height: 1.7;
  padding: var(--s2);
  background: var(--sunken);
  border-radius: var(--r-sm);
}
.eq {
  color: var(--text-muted);
}
.del {
  color: var(--danger);
  text-decoration: line-through;
}
.ins {
  color: var(--ok);
  background: var(--ok-soft);
  border-radius: 2px;
  padding: 0 2px;
}
.agentsum {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s4);
  padding: var(--s3);
  background: var(--surface);
  border: var(--hair);
  border-radius: var(--r-md);
  font-size: var(--fs-xs);
  color: var(--text-muted);
}
.agentsum b {
  color: var(--text);
  font-weight: var(--strong-weight);
}
/* The human gate. It is the only place the agent hands control back. */
.gate {
  display: flex;
  gap: var(--s2);
  padding: var(--s3);
  border: 1px solid var(--warn);
  background: var(--warn-soft);
  border-radius: var(--r-md);
}
.step {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--s2) var(--s3);
  border-left: 2px solid var(--border);
}
.step[data-status="failed"] {
  border-left-color: var(--danger);
}
.step[data-status="done"] {
  border-left-color: var(--ok);
}
.step__head {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--fs-xs);
  color: var(--text-faint);
}
.step__seg {
  margin-left: auto;
}
.step__detail {
  font-size: var(--fs-xs);
  color: var(--text-muted);
  line-height: var(--lh-tight);
}

/* -------------------------------------------------------- status bar */

.statusbar {
  height: var(--status-h);
  display: flex;
  align-items: center;
  gap: var(--s4);
  padding: 0 var(--s4);
  background: var(--chrome);
  border-top: var(--hair-strong);
  font-size: var(--fs-xs);
  color: var(--text-muted);
}
.statusbar__msg {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.statusbar__stats {
  display: flex;
  align-items: center;
  gap: var(--s3);
  flex: none;
}
.stat {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  color: var(--text-faint);
  font-size: var(--fs-xs);
  padding: 0 var(--s1);
}
.stat .num {
  color: var(--text-muted);
}
.stat--jump {
  border-radius: var(--r-sm);
  padding: 1px var(--s2);
}
.stat--jump:hover {
  background: var(--accent-faint);
  color: var(--accent);
}
.stat--jump[data-tone="danger"] .num {
  color: var(--danger);
  font-weight: var(--strong-weight);
}
.stat--meter .meter {
  width: 54px;
  flex: none;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
  background: var(--border-strong);
}
.dot[data-state="ok"] {
  background: var(--ok);
}
.dot[data-state="down"] {
  background: var(--danger);
}
.dot[data-state="busy"] {
  background: var(--warn);

/* --------------------------------------------------------- buttons */

.btn {

  align-items: center;
  justify-content: center;
  gap: var(--s2);

  padding: 0 var(--s4);

    border-color var(--dur) var(--ease);

.btn--sm {
  height: var(--ctl-h-sm);
  padding: 0 var(--s3);
}
.btn--xs {
  height: 19px;
  padding: 0 var(--s2);
  font-size: var(--fs-xs);
  font-weight: 400;
}
.btn--primary {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
}

  background: var(--accent-strong);
  border-color: var(--accent-strong);
}
.btn--outline {
  border-color: var(--border);
  color: var(--text);
  background: var(--surface-2);
}
.btn--outline:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-faint);
}
.btn--ghost {
  color: var(--text-muted);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--row-hover);
  color: var(--text);
}
.btn--danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}
.btn--danger:hover:not(:disabled) {
  filter: brightness(0.92);
}

/* -------------------------------------------------------- overlays */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 80;
  background: var(--scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s6);
}
.overlay--palette {
  align-items: flex-start;
  padding-top: 9vh;
}

.palette {
  width: min(620px, 100%);
  max-height: 62vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-3);
  border: var(--hair-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-3);
  overflow: hidden;
}
.palette__inputwrap {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 0 var(--s4);
  height: 42px;
  flex: none;
  border-bottom: var(--hair-strong);
  color: var(--text-faint);
}
.palette__inputwrap input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font-size: var(--fs-lg);
  color: var(--text);
}
.palette__list {
  overflow-y: auto;
  padding: var(--s2);
  min-height: 0;
}
.palette__group {
  padding: var(--s3) var(--s3) var(--s2);
  font-size: var(--label-size);
  font-weight: var(--label-weight);
  letter-spacing: var(--label-tracking);
  text-transform: var(--label-transform);
  color: var(--label-color);
}
.palette__item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  width: 100%;
  height: 28px;
  padding: 0 var(--s3);
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
}
.palette__item:hover {
  background: var(--row-hover);
}
.palette__item[data-sel] {
  background: var(--accent);
  color: var(--on-accent);
}
.palette__item[data-sel] kbd,
.palette__item[data-sel] mark {
  background: rgba(255, 255, 255, 0.18);
  color: inherit;
}
.palette__foot {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s4);
  flex: none;
  border-top: var(--hair);
  background: var(--surface);
  font-size: var(--fs-xs);
  color: var(--text-faint);
}
.palette__foot .kbdi {
  margin-left: 0;
}

.dialog {
  width: min(560px, 100%);
  max-height: 86%;
  display: flex;
  flex-direction: column;
  background: var(--surface-3);
  border: var(--hair-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-3);
  overflow: hidden;
}
.dialog--wide {
  width: min(900px, 100%);
}
.dialog__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  padding: var(--s4) var(--s5);
  flex: none;
  border-bottom: var(--hair-strong);
}
.dialog__head h2 {
  font-size: var(--fs-lg);
  font-weight: 650;
  letter-spacing: var(--heading-tracking);
}
.dialog__body {
  padding: var(--s5);
  overflow-y: auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s4);
}
.dialog__foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--s3);
  padding: var(--s4) var(--s5);
  flex: none;
  border-top: var(--hair-strong);
  background: var(--surface);
}
.dialog__split {
  display: grid;
  grid-template-columns: 156px 1fr;
  gap: var(--s5);
  min-height: 292px;
}
.vtabs {
  display: flex;
  flex-direction: column;
  gap: 1px;
  border-right: var(--hair);
  padding-right: var(--s4);
}
.vtabs button {
  height: var(--ctl-h);
  padding: 0 var(--s3);
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  color: var(--text-muted);
}
.vtabs button:hover {
  background: var(--row-hover);
  color: var(--text);
}
.vtabs button[data-active] {
  background: var(--accent-faint);
  color: var(--accent);

  box-shadow: inset var(--row-marker-w) 0 0 var(--accent);
}
.vtabs__body {
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  min-width: 0;
}
.dsec {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}
.filepick {
  display: flex;
  align-items: center;
  gap: var(--s3);
}
.path {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.path--muted {
  color: var(--text-faint);
}
.pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s4);
  font-size: var(--fs-xs);
  color: var(--text-faint);
  padding-top: var(--s2);
}

.overlay--gate {
  background: var(--scrim);
  backdrop-filter: blur(1.5px);
}
.gatecard {
  width: min(400px, 100%);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--s3);
  padding: var(--s5);
  background: var(--surface-3);
  border: var(--hair-strong);
  border-top: 3px solid var(--danger);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-3);
}
.gatecard__title {
  display: flex;
  align-items: center;
  gap: var(--s3);
  font-size: var(--fs-lg);
  font-weight: 650;
}
.gatecard__body {
  font-size: var(--fs-sm);
  color: var(--text-muted);
}
.gatecard__err {
  width: 100%;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--danger);
  background: var(--danger-soft);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-sm);
}

/* -------------------------------------------------------- projects */

.projects {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 7vh var(--s6) var(--s6);
  display: flex;
  flex-direction: column;
  gap: var(--s5);
  background: var(--surface-2);
}
/* One centred content column, so the empty state reads as a deliberate
   landing rather than as a page that failed to fill. */
.projects > * {
  width: 100%;
  max-width: 860px;
  margin-inline: auto;
}
.projects__toolbar {
  display: flex;
  align-items: flex-end;
  gap: var(--s3);
  padding: var(--s4);
  border: var(--hair-strong);
  border-radius: var(--r-md);
  background: var(--surface);
}
.projects__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  padding-bottom: var(--s2);
  border-bottom: var(--hair-strong);
}
.projects__head h2 {

  font-weight: 650;
  letter-spacing: var(--heading-tracking);
}
.projects__head .num {

}
.bigempty {

  align-items: center;
  justify-content: center;

  text-align: center;
  border: 1px dashed var(--border);

}
.bigempty__title {
  font-size: var(--fs-lg);
  font-weight: var(--strong-weight);
}
.bigempty__sub {
  font-size: var(--fs-sm);
  color: var(--text-faint);
  margin-top: var(--s2);
}
.projlist {
  display: flex;
  flex-direction: column;
}
.projlist__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s3) var(--s4);
  border-bottom: var(--hair);

}
.projlist__row:hover {

}
.projlist__name {
  font-weight: var(--strong-weight);
}
.projlist__pair {
  font-size: var(--fs-sm);
  color: var(--text-faint);
}

/* ===== theme-dark.css — this visual system ===== */
/* --- theme-dark.css --- */
/* DARK — 暗色专注. Ported from the Fable study onto the Opus shared IA.
   Hanken Grotesk over JetBrains Mono at 13px, 6px radii, a blue-cast dark
   gray scale. The rule that makes it work: floats separate by luminance, not
   by shadow — a dialog is lighter than the panel behind it, and the border
   stays crisp instead of dissolving into a glow. */

:root {
  color-scheme: dark;

  --bg: #121418;
  --surface: #15171c;
  --surface-2: #1b1e25;
  --surface-3: #21252d;
  --sunken: #0e1014;
  --chrome: #17191e;
  --chrome-text: #e6e9ef;

  --border: #2a2e37;
  --border-soft: #21242b;
  --border-strong: #3d434f;

  --text: #e6e9ef;
  --text-muted: #99a1b0;
  --text-faint: #6d7585;

  --accent: #3e7de8;
  --accent-strong: #7fb1f7;
  --accent-soft: rgba(62, 125, 232, 0.2);
  --accent-faint: rgba(62, 125, 232, 0.1);
  --on-accent: #ffffff;

  --ok: #43b57e;
  --ok-soft: rgba(67, 181, 126, 0.16);
  --warn: #d79f47;
  --warn-soft: rgba(215, 159, 71, 0.16);
  --danger: #e2657a;
  --danger-soft: rgba(226, 101, 122, 0.15);
  --info: #6ba7d8;
  --info-soft: rgba(107, 167, 216, 0.15);

  --font-ui: "Hanken Grotesk", "PingFang SC", "Noto Sans CJK SC",
    "WenQuanYi Micro Hei", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, monospace;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --fs-xs: 10.5px;
  --fs-sm: 11.5px;
  --fs-md: 13px;
  --fs-lg: 15px;
  --fs-xl: 19px;
  --lh: 1.52;
  --lh-tight: 1.3;

  --label-weight: 600;
  --label-tracking: 0.02em;
  --strong-weight: 600;

  --titlebar-h: 30px;
  --ribbon-h: 56px;
  --status-h: 26px;
  --tab-h: 30px;
  --row-h: 34px;
  --ctl-h: 28px;
  --ctl-h-sm: 23px;
  --rail-left: 260px;
  --rail-right: 330px;
  --cell-pad-y: 8px;
  --cell-pad-x: 11px;

  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-3: 0 20px 56px rgba(0, 0, 0, 0.62);
  --focus: 0 0 0 2px var(--accent-soft), 0 0 0 3px var(--accent);
  --scrim: rgba(6, 8, 11, 0.62);

  --row-hover: rgba(255, 255, 255, 0.035);
  --row-active: var(--accent-faint);
  --dur: 130ms;
  --ease: cubic-bezier(0.2, 0.6, 0.3, 1);
}

/* Floats rise by luminance. The border does the separating, so the shadow can
   stay quiet instead of smearing the panel underneath. */
.dialog,
.palette,
.gatecard,
.menudrop,
.rowmenu,
.findwidget {
  background: var(--surface-3);
  border-color: var(--border-strong);
}
.dialog__head,
.dialog__foot,
.palette__inputwrap,
.palette__foot {
  background: var(--surface-2);
  border-color: var(--border);
}
.docktabs [role="tab"][data-active] {
  background: var(--accent-soft);
  color: var(--accent-strong);
}
kbd,
.kbdi,
.dchip {
  background: var(--surface-3);
  border-color: var(--border-strong);
  color: var(--text-muted);
}
.btn--outline {
  background: transparent;
}
/* The layout preview is a lit sheet on a dark desk. */
.preview__page {
  background: #f6f7f9;
  color: #16181d;
  box-shadow: var(--shadow-2);
}

</style>

const esc = (s) =>
  String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** Placeholder grammar mirrored from lib/tokens.ts. */
const TOKEN_RE = /(\{\{[^}]+\}\}|\{[^}\s]+\}|%[sd]|<\/?[a-zA-Z][^>]*>|&[a-z]+;)/g;

function tokens(text, danger) {
  if (!text) return "";
  return esc(text).replace(
    /(\{\{[^}]+\}\}|\{[^}\s]+\}|%[sd]|&lt;\/?[a-zA-Z][^&]*&gt;|&amp;[a-z]+;)/g,
    (m) => {
      const raw = m.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
      const bad = danger && danger.includes(raw);
      return `<span class="tok"${bad ? ' data-danger="1"' : ""}>${m}</span>`;
    },
  );
}

function ic(name, size) {
  const d = ICONS[name];
  if (!d) return "";
  const paths = d.split("|").map((p) => `<path d="${p}"/>`).join("");
  return `<svg class="ic" width="${size || 16}" height="${size || 16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
}

/* The view is re-rendered wholesale on every state change, so an entrance
   animation keyed on markup alone would replay on every keystroke. Overlays
   ask here instead and are only marked on the render where they appear. */
const ENTERED = {};
function entering(key, value) {
  const fresh = ENTERED[key] !== value;
  ENTERED[key] = value;
  return fresh && value ? ' data-enter="1"' : "";
}

const kbd = (k) =>
  k
    ? `<span class="kbd">${k
        .split("+")
        .map((p) => `<kbd>${esc(p)}</kbd>`)
        .join("")}</span>`
    : "";

const FILE_ICON = { docx: "fileDoc", markdown: "fileMd", json: "fileJson" };

/** Folds the flat document list into the nested shape the rail draws. */
function fileTree(docs) {
  const root = { dirs: new Map(), files: [] };
  docs.forEach((d) => {
    let node = root;
    let path = "";
    (d.dir ? d.dir.split("/") : []).forEach((part) => {
      path = path ? `${path}/${part}` : part;
      if (!node.dirs.has(part)) node.dirs.set(part, { name: part, path, dirs: new Map(), files: [] });
      node = node.dirs.get(part);
    });
    node.files.push(d);
  });
  return root;
}

/** Aggregate progress for a folder, so a collapsed folder still reports. */
function dirRollup(node) {
  const acc = { total: 0, confirmed: 0, open: 0, files: 0 };
  const walk = (n) => {
    n.files.forEach((f) => {
      acc.total += f.total;
      acc.confirmed += f.confirmed;
      acc.open += f.open;
      acc.files += 1;
    });
    n.dirs.forEach(walk);
  };
  walk(node);
  return acc;
}

const TERM_SEGMENTS = [10, 12, 14, 18];

function seg(n) {
  return S.segments.find((x) => x.n === n) || null;
}
function openIssues(n) {
  return S.issues.filter((i) => i.seg === n && i.status === "open");
}
function counts() {
  const c = { total: S.segments.length, confirmed: 0, draft: 0, untranslated: 0 };
  S.segments.forEach((s) => (c[s.state] += 1));
  c.open = S.issues.filter((i) => i.status === "open").length;
  return c;
}
function hasTag(s) {
  TOKEN_RE.lastIndex = 0;
  return TOKEN_RE.test(s.src) || TOKEN_RE.test(s.tgt);
}
function visibleSegments() {
  const q = S.query.trim().toLowerCase();
  return S.segments.filter((s) => {
    for (const f of S.filters) {
      if (f === "qa" && openIssues(s.n).length === 0) return false;
      if (f === "locked" && !s.locked) return false;
      if (f === "term" && !TERM_SEGMENTS.includes(s.n)) return false;
      if (f === "tag" && !hasTag(s)) return false;
      if (["untranslated", "draft", "confirmed"].includes(f) && s.state !== f) return false;
    }
    if (q && !(s.src + "\n" + s.tgt).toLowerCase().includes(q)) return false;
    return true;
  });
}
function findMatches() {
  const q = S.find.q.trim().toLowerCase();
  if (!q) return [];
  return visibleSegments().filter((s) => (s.src + "\n" + s.tgt).toLowerCase().includes(q));
}

function dispatch(cmd, arg) {
  S.menu = null;
  S.rowMenu = null;
  const a = seg(S.active);
  switch (cmd) {
    case "new-project":
      S.dialog = "newproject";
      break;
    case "import-document":
      S.dialog = "import";
      break;
    case "export-document":
      if (S.issues.filter((i) => i.status === "open" && i.severity === "error").length > 0) {
        S.banner = "gate";
        status("导出被质量门拦截");
      } else {
        S.banner = "overwrite";
        status("目标已存在，等待覆盖决定");
      }
      break;
    case "open-project-settings":
      S.dialog = "settings";
      break;
    case "open-tm-manage":
      S.dialog = "tm";
      break;
    case "open-term-manage":
      S.dialog = "term";
      break;
    case "close-project":
      applyScenario("projects");
      return;
    case "archive-project":
      S.dialog = "settings";
      S.settingsTab = "lifecycle";
      break;
    case "open-command-palette":
      S.palette = { open: true, q: "", sel: 0 };
      break;
    case "toggle-preview":
      S.preview.open = !S.preview.open;
      status(S.preview.open ? "已展开预览面板" : "已折叠预览面板");
      break;
    case "toggle-left":
      S.leftCollapsed = !S.leftCollapsed;
      break;
    case "toggle-right":
      S.rightCollapsed = !S.rightCollapsed;
      break;
    case "show-dock-memory":
      S.dock = "memory";
      break;
    case "show-dock-term":
      S.dock = "term";
      break;
    case "show-dock-qa":
      S.dock = "qa";
      break;
    case "show-dock-ai":
      S.dock = "ai";
      break;
    case "open-find":
      S.find.open = true;
      S.find.mode = "find";
      break;
    case "open-replace":
      S.find.open = true;
      S.find.mode = "replace";
      break;
    case "find-next":
    case "find-prev": {
      const m = findMatches();
      if (!S.find.q.trim()) {
        S.find.open = true;
        S.find.mode = "find";
        break;
      }
      if (m.length === 0) {
        status(`查找「${S.find.q.trim()}」：没有匹配`);
        break;
      }
      const idx = m.findIndex((x) => x.n === S.active);
      const step = cmd === "find-next" ? 1 : -1;
      const nx = m[(idx + step + m.length * 2) % m.length];
      const wrapped = cmd === "find-next" ? idx >= m.length - 1 : idx <= 0;
      S.active = nx.n;
      status(
        wrapped
          ? `查找「${S.find.q.trim()}」：已从${cmd === "find-next" ? "头" : "末尾"}继续，跳到句段 #${nx.n}`
          : `查找「${S.find.q.trim()}」：句段 #${nx.n}`,
      );
      break;
    }
    case "replace-one":
      if (a && a.state === "confirmed" && !S.find.incl) {
        status(`句段 #${a.n} 已确认，未替换`);
      } else if (a && S.find.q.trim()) {
        const before = a.tgt;
        a.tgt = a.tgt.split(S.find.q).join(S.find.r);
        const n = before === a.tgt ? 0 : 1;
        status(n ? `句段 #${a.n} 已替换 1 处「${S.find.q}」` : `句段 #${a.n} 无匹配，已跳到下一处`);
      }
      break;
    case "replace-all": {
      let segs = 0;
      let occ = 0;
      let skippedConfirmed = 0;
      let skippedLocked = 0;
      S.segments.forEach((s) => {
        if (!s.tgt.includes(S.find.q) || !S.find.q.trim()) return;
        if (s.locked) return skippedLocked++;
        if (s.state === "confirmed" && !S.find.incl) return skippedConfirmed++;
        occ += s.tgt.split(S.find.q).length - 1;
        s.tgt = s.tgt.split(S.find.q).join(S.find.r);
        if (s.state === "confirmed") s.state = "draft";
        segs++;
      });
      status(
        segs
          ? `全部替换完成：${segs} 个句段、${occ} 处「${S.find.q}」→「${S.find.r}」${skippedConfirmed ? `；跳过 ${skippedConfirmed} 个已确认句段` : ""}${skippedLocked ? `；跳过 ${skippedLocked} 个已锁定句段` : ""}`
          : `全部替换：译文中没有「${S.find.q}」`,
      );
      break;
    }
    case "focus-filter":
      S.focusFilter = true;
      break;
    case "open-concordance":
      S.dock = "memory";
      S.concord = "memory";
      break;
    case "confirm-segment":
    case "confirm-segment-any":
    case "confirm-segment-stay": {
      if (!a) break;
      if (a.locked) {
        status(`句段 #${a.n} 已锁定，无法确认`);
        break;
      }
      if (!a.tgt.trim()) {
        status(`句段 #${a.n} 译文为空，无法确认`);
        break;
      }
      a.state = "confirmed";
      if (!a.origin) a.origin = { kind: "tmExact", score: 100 };
      const q = openIssues(a.n).length;
      status(
        `句段 #${a.n} 已确认并写入 TM，TM 传播 2 个重复句段${q ? `，QA ${q} 个问题` : ""}`,
      );
      if (cmd !== "confirm-segment-stay") {
        const vis = visibleSegments();
        const i = vis.findIndex((x) => x.n === a.n);
        for (let k = i + 1; k < vis.length; k++) {
          const c = vis[k];
          if (c.locked) continue;
          if (cmd === "confirm-segment-any" || c.state !== "confirmed") {
            S.active = c.n;
            break;
          }
        }
      }
      break;
    }
    case "toggle-lock-segment":
      if (!a) break;
      a.locked = !a.locked;
      if (a.locked) S.editing = false;
      status(`句段 #${a.n} 已${a.locked ? "锁定" : "解锁"}`);
      break;
    case "copy-source":
      if (!a || a.locked) break;
      a.tgt = a.src;
      if (a.state === "untranslated") a.state = "draft";
      status(`句段 #${a.n} 已复制源文为草稿`);
      break;
    case "clear-target":
      if (!a || a.locked) break;
      a.tgt = "";
      a.state = "untranslated";
      a.origin = undefined;
      status(`句段 #${a.n} 已清空译文`);
      break;
    case "pretranslate": {
      let filled = 0;
      S.segments.forEach((s) => {
        if (s.state === "untranslated" && !s.locked && s.n >= 23) {
          s.tgt =
            {
              23: "未经明确决定，导出不会覆盖已存在的文件。",
              24: "当项目开启“有错误时阻止导出”时，质量门会列出未通过的规则。",
              25: "Agent 负责起草与检查；审核与导出仍由人完成。",
              26: "这里不会报告引擎未确认的成功。",
            }[s.n] || s.tgt;
          s.state = "draft";
          s.origin = { kind: "tmFuzzy", score: 78 };
          filled++;
        }
      });
      status(
        `预翻译完成：检查 ${counts().untranslated + filled} 个未译句段，填充 ${filled} 个（精确 0 / 模糊 ${filled}），跳过 1 个已锁定句段`,
      );
      break;
    }
    case "insert-tm":
      if (!a || a.locked) break;
      a.tgt = TM_MATCHES[0].tgt;
      a.state = "draft";
      a.origin = { kind: "tmExact", score: 100 };
      S.dock = "memory";
      status("已应用第 1 条记忆匹配（100%）为草稿");
      break;
    case "insert-term":
      if (!a || a.locked) break;
      a.tgt = a.tgt + "记忆库";
      S.dock = "term";
      status("已在光标处插入术语「记忆库」");
      break;
    case "apply-tm":
      if (!a || a.locked) break;
      a.tgt = TM_MATCHES[arg].tgt;
      a.state = "draft";
      a.origin = {
        kind: TM_MATCHES[arg].grade === "fuzzy" ? "tmFuzzy" : "tmExact",
        score: TM_MATCHES[arg].score,
      };
      status(`已应用第 ${arg + 1} 条记忆匹配（${TM_MATCHES[arg].score}%）为草稿`);
      break;
    case "run-qa":
      S.dock = "qa";
      status(`QA 完成：检查 ${S.segments.length} 个句段，${counts().open} 个未解决问题`);
      break;
    case "waive": {
      const i = S.issues.find((x) => x.id === arg);
      if (i) i.status = "waived";
      status("已忽略 QA 问题");
      break;
    }
    case "waive-rule": {
      const i = S.issues.find((x) => x.id === arg);
      let n = 0;
      if (i)
        S.issues.forEach((x) => {
          if (x.rule === i.rule && x.status === "open") {
            x.status = "waived";
            n++;
          }
        });
      status(`已忽略 ${n} 个 QA 问题`);
      break;
    }
    case "waive-segment": {
      const i = S.issues.find((x) => x.id === arg);
      let n = 0;
      if (i)
        S.issues.forEach((x) => {
          if (x.seg === i.seg && x.status === "open") {
            x.status = "waived";
            n++;
          }
        });
      status(`已忽略 ${n} 个 QA 问题`);
      break;
    }
    case "restore": {
      const i = S.issues.find((x) => x.id === arg);
      if (i) i.status = "open";
      status("已恢复 QA 问题为未解决");
      break;
    }
    case "apply-fix": {
      const i = S.issues.find((x) => x.id === arg);
      if (i && i.fix) {
        const t = seg(i.seg);
        t.tgt = i.fix.text;
        if (t.state === "confirmed") t.state = "draft";
        i.status = "resolved";
        status(`句段 #${i.seg} 已应用修复`);
      }
      break;
    }
    case "jump":
      S.active = arg;
      if (!visibleSegments().some((s) => s.n === arg)) S.filters = [];
      break;
    case "ai-translate":
      S.dock = "ai";
      S.aiCandidate = true;
      status("AI 翻译完成（gpt-4o-mini，1,180ms）");
      break;
    case "ai-refine":
      S.dock = "ai";
      S.aiCandidate = true;
      status("AI 润色完成（gpt-4o-mini，940ms）");
      break;
    case "ai-configure":
      S.ai.configured = true;
      status("AI 供应商已配置：openai / gpt-4o-mini");
      break;
    case "agent-start":
      S.agent = "awaitingReview";
      status(`Agent 已完成：TM 5，AI 草稿 6，失败 1，QA 未解决 ${counts().open}`);
      break;
    case "agent-cancel":
      S.agent = null;
      status("Agent 运行已取消");
      break;
    case "gate-override":
      S.banner = "overwrite";
      status("已通过质量门，目标文件已存在");
      break;
    case "gate-cancel":
    case "overwrite-cancel":
      S.banner = null;
      status("已取消导出");
      break;
    case "overwrite-confirm":
      S.banner = null;
      status("导出完成（已覆盖）：/Users/lin/exports/onboarding-guide-translated.docx（22 个已译单元）");
      break;
    case "engine-relaunch":
      S.engine = "ready";
      status("引擎已恢复，已重新同步");
      break;
    case "undo":
    case "redo":
      status(cmd === "undo" ? "已撤销上一步编辑" : "已重做上一步编辑");
      break;
    case "toggle-gate":
      PROJECT.blockExportOnError = !PROJECT.blockExportOnError;
      status(PROJECT.blockExportOnError ? "已开启导出前 QA 检查" : "已关闭导出前 QA 检查");
      break;
    case "help-keys":
      S.palette = { open: true, q: "", sel: 0 };
      break;
    default:
      if (cmd && cmd.startsWith("open-doc-")) {
        S.activeDoc = cmd.replace("open-doc-", "doc-");
        if (!S.openDocs.includes(S.activeDoc)) S.openDocs.push(S.activeDoc);
        status(`已切换到「${DOCUMENTS.find((d) => d.id === S.activeDoc).name}」`);
      }
      break;
  }
  render();
}

const indent = (d) => `<span class="tree__indent">${'<i></i>'.repeat(d)}</span>`;

/* Folders first, then files, each alphabetical — the ordering an IDE uses.
   A search forces every folder open so a hit is never hidden behind a
   collapsed chevron. */
function vTreeNodes(node, depth, forceOpen) {
  let out = "";
  [...node.dirs.values()]
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach((dir) => {
      const open = forceOpen || !S.collapsedDirs.includes(dir.path);
      const roll = dirRollup(dir);
      const pct = roll.total ? Math.round((roll.confirmed / roll.total) * 100) : 0;
      out += `<button class="tree__row tree__row--dir" role="treeitem" aria-expanded="${open}"
        data-dir="${esc(dir.path)}" style="--depth:${depth}" title="${esc(dir.path)} — ${roll.files} 个文件，已确认 ${pct}%">
        ${indent(depth)}
        <span class="tree__chev" data-open="${open ? 1 : 0}">${ic("right", 12)}</span>
        <span class="tree__icon">${ic(open ? "folderOpen" : "folderShut", 15)}</span>
        <span class="tree__name">${esc(dir.name)}</span>
        <span class="tree__tail">
          ${roll.open ? `<span class="tree__qa" data-tone="danger">${roll.open}</span>` : ""}
          <span class="tree__count num">${roll.files}</span>
        </span>
      </button>`;
      if (open) out += vTreeNodes(dir, depth + 1, forceOpen);
    });

  [...node.files]
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach((d) => {
      const pct = Math.round((d.confirmed / d.total) * 100);
      const armed = S.removeArmed === d.id;
      const active = d.id === S.activeDoc;
      const openTab = S.openDocs.includes(d.id);
      out += `<div class="tree__filerow"${active ? ' data-active="1"' : ""}${openTab ? ' data-opentab="1"' : ""}>
        <button class="tree__row tree__row--file" role="treeitem" style="--depth:${depth}"
          data-cmd="open-doc-${d.id.replace("doc-", "")}"
          title="${esc((d.dir ? d.dir + "/" : "") + d.name)}&#10;已确认 ${d.confirmed}/${d.total}（${pct}%）${d.draft ? `，草稿 ${d.draft}` : ""}${d.open ? `，QA 未解决 ${d.open}` : ""}">
          ${indent(depth)}
          <span class="tree__chev"></span>
          <span class="tree__icon" data-fmt="${d.format}">${ic(FILE_ICON[d.format] || "fileDoc", 15)}</span>
          <span class="tree__name">${esc(d.name)}</span>
          <span class="tree__tail">
            ${d.open ? `<span class="tree__qa" data-tone="danger">${d.open}</span>` : ""}
            <span class="tree__prog" data-done="${pct === 100 ? 1 : 0}" data-none="${pct === 0 ? 1 : 0}"
              style="--pct:${pct}%"><span class="num">${pct}</span></span>
          </span>
        </button>
        ${
          armed
            ? `<span class="tree__confirm"><button class="btn btn--danger btn--xs" data-act="remove-yes" data-doc="${d.id}">确认移除</button><button class="btn btn--ghost btn--xs" data-act="remove-no">取消</button></span>`
            : `<button class="tree__remove iconbtn" data-act="remove-arm" data-doc="${d.id}" aria-label="从项目移除 ${esc(d.name)}">${ic("trash", 13)}</button>`
        }
      </div>`;
    });
  return out;
}

const STATE_GLYPH = { untranslated: "○", draft: "✎", confirmed: "✓" };
const STATE_LABEL = { untranslated: "未译", draft: "草稿", confirmed: "已确认", locked: "锁定" };

function vOrigin(s) {
  if (!s.origin) return "";
  const o = s.origin;
  const isTm = o.kind === "tmExact" || o.kind === "tmFuzzy";
  const label = isTm ? "TM" : "AI";
  const title = [
    `状态：${STATE_LABEL[s.state]}`,
    `来源：${o.kind === "tmExact" ? "TM 精确" : o.kind === "tmFuzzy" ? "TM 模糊" : "AI"}`,
    o.score !== undefined ? `分值：${o.score}` : null,
    o.model ? `模型：${o.model}` : null,
  ]
    .filter(Boolean)
    .join("\n");
  return `<span class="origin" data-grade="${isTm ? (o.kind === "tmFuzzy" ? "fuzzy" : "exact") : "ai"}"${o.edited ? ' data-muted="1"' : ""} title="${esc(title)}">
    ${o.score !== undefined ? `<span class="num">${o.score}</span>` : ""}<span class="origin__k">${label}</span></span>`;
}

  const vis = visibleSegments();
  if (vis.length === 0)
    return `<div class="grid"><p class="empty empty--big">没有符合筛选条件的句段</p></div>`;
  const danger = {};
  S.issues.forEach((i) => {
    if (i.status !== "open") return;
    if (i.rule.startsWith("qa.tag-placeholder")) {
      danger[i.seg] = (i.evidence.source || []).concat(i.evidence.target || []);
    }
  });
  return `<div class="grid" id="grid">
    <table>
      <thead><tr>
        <th class="c-n">#</th>
        <th class="c-src">源文<span class="loc">${PROJECT.source}</span></th>

        <th class="c-st">状态</th>
      </tr></thead>
      <tbody>
      ${vis
        .map((s) => {
          const act = s.n === S.active;
          const iss = openIssues(s.n);
          const editing = act && S.editing && !s.locked;
          return `<tr data-row="${s.n}" data-state="${s.state}"${act ? ' data-active="1"' : ""}${
            editing ? ' data-editing="1"' : ""

        <td class="c-n"><span class="rowbar"></span><span class="num">${s.n}</span></td>
        <td class="c-src">${tokens(s.src, danger[s.n])}</td>
        <td class="c-tgt">${
          editing
            ? `<div class="editor"><textarea id="editor" aria-label="句段 ${s.n} 译文" rows="1">${esc(s.tgt)}</textarea></div>`
            : `<span class="tgt">${tokens(s.tgt, danger[s.n]) || '<span class="tgt--empty">—</span>'}</span>`
        }</td>
        <td class="c-st">
          <span class="statecell">
            ${s.locked ? `<span class="lockglyph" title="已锁定">${ic("lock", 12)}</span>` : ""}
            <span class="statechip" data-state="${s.state}" title="${STATE_LABEL[s.state]}${iss.length ? `，${iss.length} 个未解决 QA 问题` : ""}">
              <span class="statechip__g">${STATE_GLYPH[s.state]}</span>
              <span class="statechip__t">${STATE_LABEL[s.state]}</span>
              ${iss.length ? `<span class="statechip__qa">⚠${iss.length}</span>` : ""}
            </span>
            ${vOrigin(s)}
            <span class="rowmenu-wrap">
              <button class="iconbtn rowmenu__btn" data-act="rowmenu" data-row="${s.n}" aria-label="句段 ${s.n} 菜单">${ic("dots", 14)}</button>
              ${
                S.rowMenu === s.n
                  ? `<div class="rowmenu" role="menu">
                  <button role="menuitem" data-cmd="copy-source" ${s.locked ? "disabled" : ""}>复制源文</button>
                  <button role="menuitem" data-cmd="clear-target" ${s.locked || !s.tgt ? "disabled" : ""}>清空译文</button>

const SEV = { error: ["⛔", "错误"], warning: ["⚠", "警告"], info: ["ⓘ", "提示"] };
const STATUS_CN = { open: "未解决", waived: "已忽略", resolved: "已解决" };

function vIssue(i, ruleCount, segCount) {
  const ev = (i.evidence.source || []).length || (i.evidence.target || []).length;
  return `<article class="issue" data-status="${i.status}" data-severity="${i.severity}">
    <div class="issue__head">
      <span class="issue__lead">
        <span class="sev" data-severity="${i.severity}" title="${SEV[i.severity][1]}">${SEV[i.severity][0]}</span>
        <span class="pill" data-tone="${i.status === "open" ? "danger" : i.status === "waived" ? "warn" : "ok"}">${STATUS_CN[i.status]}</span>
        <code class="rule">${i.rule}</code>
      </span>
      <button class="btn btn--ghost btn--xs" data-jump="${i.seg}">句段 <span class="num">#${i.seg}</span></button>
    </div>
    <p class="issue__msg">${esc(i.message)}</p>
    ${ev ? `<p class="issue__ev">源 [<span class="num">${(i.evidence.source || []).map(esc).join(", ")}</span>] ≠ 译 [<span class="num">${(i.evidence.target || []).map(esc).join(", ")}</span>]</p>` : ""}
    ${
      i.fix && i.status === "open"
        ? `<div class="fix">
      <span class="fix__text">修复为：${esc(i.fix.text)}</span>
      <button class="btn btn--outline btn--xs" data-cmd="apply-fix" data-arg="${i.id}" title="${esc(i.fix.label)}">应用修复</button>
    </div>`
        : ""
    }
    ${i.note ? `<p class="issue__note">备注：${esc(i.note)}</p>` : ""}
    <div class="issue__acts">
      ${i.status === "open" ? `<button class="btn btn--outline btn--xs" data-cmd="waive" data-arg="${i.id}">忽略</button>` : ""}
      ${i.status === "open" && ruleCount > 1 ? `<button class="btn btn--outline btn--xs" data-cmd="waive-rule" data-arg="${i.id}" title="忽略同一规则的 ${ruleCount} 个问题">忽略同类 <span class="num">${ruleCount}</span></button>` : ""}
      ${i.status === "open" && segCount > 1 ? `<button class="btn btn--outline btn--xs" data-cmd="waive-segment" data-arg="${i.id}" title="忽略句段 #${i.seg} 的 ${segCount} 个问题">忽略本句 <span class="num">${segCount}</span></button>` : ""}
      ${i.status === "waived" ? `<button class="btn btn--outline btn--xs" data-cmd="restore" data-arg="${i.id}">恢复为未解决</button>` : ""}
    </div>
  </article>`;
}

function vQaDock() {
  const open = S.issues.filter((i) => i.status === "open");
  const groups = [];
  open.forEach((i) => {
    const g = groups.find((x) => x[0] === i.rule);
    if (g) g[1].push(i);
    else groups.push([i.rule, [i]]);
  });
  const rank = { error: 0, warning: 1, info: 2 };
  groups.sort((a, b) => rank[a[1][0].severity] - rank[b[1][0].severity]);
  const segCount = {};
  open.forEach((i) => (segCount[i.seg] = (segCount[i.seg] || 0) + 1));
  const waived = S.issues.filter((i) => i.status === "waived");
  const resolved = S.issues.filter((i) => i.status === "resolved");
  return `<section class="panel panel--fill">
    <header class="panel__head"><h3>质量检查<span class="hcount">未解决 <span class="num">${open.length}</span></span></h3>
      <span class="panel__act"><button class="btn btn--primary btn--xs" data-cmd="run-qa">运行 QA</button></span>
    </header>
    <div class="panel__body">
      ${
        S.issues.length === 0
          ? `<p class="empty">尚未运行检查</p>`
          : groups
              .map(
                ([rule, list]) => `<section class="issuegroup">
        <div class="issuegroup__head"><code class="rule">${rule}</code><span class="num">${list.length}</span></div>
        ${list.map((i) => vIssue(i, list.length, segCount[i.seg] || 1)).join("")}
      </section>`,
              )
              .join("") +
            (waived.length
              ? `<div class="subhead">已忽略 <span class="num">${waived.length}</span></div>` +
                waived.map((i) => vIssue(i, 0, 0)).join("")
              : "") +
            (resolved.length
              ? `<div class="subhead">已解决 <span class="num">${resolved.length}</span></div>` +
                resolved.map((i) => vIssue(i, 0, 0)).join("")
              : "")
      }
    </div>
  </section>`;
}
