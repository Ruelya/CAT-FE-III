name: package-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: package-windows-node-24
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Electron install integrity
        run: pnpm electron:install:check
      - name: Build Engine (release)
        run: cargo build -p translunar-engine --release
      - name: Electron and Engine E2E
        run: pnpm test:e2e:desktop
      - name: Test package architecture and Engine exclusivity gates
        run: pnpm release:package:gate-test
      - name: Test installer smoke protocol helpers
        run: pnpm release:install-smoke:test
      - name: Verify host Engine binary
        shell: pwsh
        run: |
          $bin = "target/release/translunar-engine.exe"
          if (-not (Test-Path $bin)) {
            throw "Engine binary missing: $bin"
          }
          Write-Host "engine binary present: $bin"
          $arch = $env:PROCESSOR_ARCHITECTURE
          if ($arch -eq "AMD64") { $mapped = "x64" }
          elseif ($arch -eq "ARM64") { $mapped = "arm64" }
          else { $mapped = $arch.ToLower() }
          "TRANSLUNAR_PACKAGE_ARCH=$mapped" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "TRANSLUNAR_PACKAGE_ARCH=$mapped"
      - name: Package Windows (host arch only)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm package:win
      - name: Package size / Engine presence / arch gate
        run: pnpm release:package:check
      - name: Install / launch / Engine smoke
        run: pnpm release:install-smoke --platform win32
      - name: List release artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse -File apps/desktop/release | Select-Object FullName, Length
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: translunar-windows-node-24
          path: apps/desktop/release/**
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "v$($pkg.version)"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "release tag: $tag"
      - name: Assert Windows installer exists
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path apps/desktop/release -File -Filter "Translunar-CAT-*-win-*.exe"
          if (-not $exes) {
            throw "Windows NSIS installer missing under apps/desktop/release"
          }
          $exes | ForEach-Object { Write-Host "installer: $($_.FullName) ($($_.Length) bytes)" }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Translunar CAT ${{ steps.release.outputs.tag }}
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            apps/desktop/release/Translunar-CAT-*-win-*.exe
            apps/desktop/release/Translunar-CAT-*-win-*.exe.blockmap
            apps/desktop/release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
