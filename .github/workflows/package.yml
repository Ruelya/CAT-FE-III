name: package

# Manual packaging lane: produces the unsigned, unpackaged Linux directory
# artifact and verifies it carries the engine binary where packaged Electron
# main looks (resources/engine/tl-engine). Deliberately workflow_dispatch-only
# so packaging can never break PR CI. Windows/macOS packaging is config-only
# and has no lane here; see docs/packaging.md.
on:
  workflow_dispatch:

jobs:
  package-linux-dir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Install
        run: pnpm install --frozen-lockfile
      # Builds the release engine, the renderer + electron main/preload,
      # stages the engine binary, packages the dir target, and fails unless
      # the artifact contains resources/engine/tl-engine.
      - name: Package unpackaged directory
        run: pnpm package:dir
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: translunar-cat-linux-unpacked
          path: apps/desktop/release/linux-unpacked/
          if-no-files-found: error
