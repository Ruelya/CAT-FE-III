name: package-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Engine (release)
        run: cargo build -p translunar-engine --release
      - name: Test package architecture and Engine exclusivity gates
        run: pnpm release:package:gate-test
      - name: Test installer smoke protocol helpers
        run: pnpm release:install-smoke:test
      - name: Verify host Engine binary and map arch
        run: |
          BIN="target/release/translunar-engine"
          if [ ! -f "$BIN" ]; then
            echo "Engine binary missing: $BIN" >&2
            exit 1
          fi
          echo "engine binary present: $BIN"
          MACHINE="$(uname -m)"
          case "$MACHINE" in
            x86_64|amd64) MAPPED=x64 ;;
            arm64|aarch64) MAPPED=arm64 ;;
            *) MAPPED="$MACHINE" ;;
          esac
          echo "TRANSLUNAR_PACKAGE_ARCH=$MAPPED" >> "$GITHUB_ENV"
          echo "TRANSLUNAR_PACKAGE_ARCH=$MAPPED"
      - name: Package macOS (host arch only)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm package:mac
      - name: Package size / Engine presence / arch gate
        run: pnpm release:package:check
      - name: Install / launch / Engine smoke
        run: pnpm release:install-smoke --platform darwin
      - name: Record minimum OS evidence
        run: |
          echo "minimumSystemVersion=12.0" > apps/desktop/release/macos-min-os.txt
          echo "runner=$(sw_vers -productVersion)" >> apps/desktop/release/macos-min-os.txt
          echo "packageArch=${TRANSLUNAR_PACKAGE_ARCH}" >> apps/desktop/release/macos-min-os.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: translunar-macos
          path: apps/desktop/release/**
