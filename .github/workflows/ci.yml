name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The engine's process-tier plugin tests enable real `kind: "node"`
      # plugins, which spawn `node` from PATH. Without a Node runtime on this
      # runner every one of those tests fails with a bare ENOENT, so the Rust
      # lane needs Node just as much as the Node lane needs Rust.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  node:
    name: node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.17.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Install PDF test tools and a headless display with a window manager
        # fluxbox is not decoration: BrowserWindow.maximize() is a no-op under
        # bare Xvfb, which silently guts the custom title bar's maximize and
        # restore assertions. x11-utils supplies the xdpyinfo readiness probe
        # scripts/linux-display.sh waits on.
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr xvfb fluxbox x11-utils
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Allow Electron to sandbox itself
        # Ubuntu 24.04 runners block unprivileged user namespaces, so Chromium
        # falls back to the SUID sandbox helper and aborts unless that helper is
        # root-owned and setuid. Fixing the helper keeps the sandbox on instead
        # of papering over it with --no-sandbox.
        run: |
          sandbox="$(realpath apps/desktop/node_modules/electron/dist/chrome-sandbox)"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ls -l "$sandbox"
      - name: Electron install integrity
        run: pnpm electron:install:check
      - name: Contracts
        run: pnpm contracts:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Engine E2E
        run: pnpm test:e2e:engine
      - name: Desktop E2E
        run: pnpm test:e2e:desktop:linux
