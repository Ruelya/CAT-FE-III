name: commit-identity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests
        run: node --test scripts/check-commit-identity.test.mjs
      - name: Check commit authors
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch origin "${GITHUB_BASE_REF}"
            node scripts/check-commit-identity.mjs --range "origin/${GITHUB_BASE_REF}..HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "${before}" ] || echo "${before}" | grep -Eq '^0+$'; then
              node scripts/check-commit-identity.mjs --range "HEAD"
            else
              node scripts/check-commit-identity.mjs --range "${before}..${{ github.sha }}"
            fi
          fi
