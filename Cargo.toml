[workspace]
resolver = "3"
members = [
  "crates/domain",
  "crates/filter-core",
  "crates/pipeline",
  "crates/protocol",
  "crates/storage",
  "crates/filter-docx",
  "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.54", features = ["derive"] }
quick-xml = "0.41.0"
regex = "1.12.2"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
schemars = { version = "1.2.1", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
